# Sources candidates pour la veille agentic commerce, auditées par source_audit.py.
# Chaque source est mesurée sur ses publications récentes : rythme (articles/jour)
# et pertinence (part des articles qui touchent le périmètre, via les mots-clés ci-dessous).

# Mots-clés du périmètre, avec un poids : 3 = cœur de l'offre, 2 = sujet direct, 1 = contexte.
keywords:
  3: [agentic commerce, commerce agentique, agentic checkout, agentic payment, ai agent, ai agents,
      shopping agent, agent payments, agentic ai, acp, agent commerce, buy for me, instant checkout,
      generative engine optimization, " geo ", ai search, ai overviews, answer engine, llm visibility,
      ai mode, chatgpt shopping, perplexity shopping]
  2: [social commerce, tiktok shop, live shopping, livestream shopping, shoppable, creator commerce,
      affiliate, retail media, marketplace, chatgpt, openai, perplexity, gemini, copilot, shopify,
      checkout, conversational commerce, personalization, personnalisation, ia générative, generative ai]
  1: [e-commerce, ecommerce, e-commerce, online retail, retail, retailer, dtc, d2c, amazon, walmart,
      temu, shein, zalando, beauty, luxury, luxe, payments, paiement, stripe, visa, mastercard, paypal]

