name: Audit des sources de veille IA

on:
  schedule:
    # Le 1er de chaque mois, après l'audit e-commerce.
    - cron: "53 3 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai_watch/audit/candidates.yaml"
      - ".github/workflows/ai-source-audit.yml"

permissions:
  contents: write

concurrency:
  group: ai-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer Scrapling depuis ce repo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fetchers]" pyyaml
      - name: Auditer les sources IA
        run: python ecommerce_watch/audit/source_audit.py --candidates ai_watch/audit/candidates.yaml --out ai_watch/audit
      - name: Commit de l'audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_watch/audit/latest.json ai_watch/audit/latest.md
          git stash --include-untracked --keep-index -q || true
          if git diff --cached --quiet; then echo "Rien de nouveau"; else
            git commit -m "Audit des sources IA $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
