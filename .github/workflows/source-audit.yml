name: Audit des sources de veille

on:
  schedule:
    # Le 1er de chaque mois : on vérifie que la liste de sources reste la plus pertinente.
    - cron: "41 3 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ecommerce_watch/audit/**.py"
      - "ecommerce_watch/audit/candidates.yaml"

permissions:
  contents: write

concurrency:
  group: ecommerce-watch
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer Scrapling depuis ce repo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fetchers]" pyyaml
      - name: Auditer les sources
        run: python ecommerce_watch/audit/source_audit.py
      - name: Commit de l'audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecommerce_watch/audit/latest.json ecommerce_watch/audit/latest.md
          if git diff --cached --quiet; then echo "Rien de nouveau"; else
            git commit -m "Audit des sources $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
