# Sources candidates pour la veille IA (Taskforce IA), auditées le 1er de chaque mois par
#   python ecommerce_watch/audit/source_audit.py --candidates ai_watch/audit/candidates.yaml --out ai_watch/audit
# Mots-clés avec un poids : 3 = cœur du périmètre, 2 = sujet direct, 1 = contexte.
keywords:
  3: [ai agent, ai agents, agentic ai, agentic, large language model, llm, frontier model, foundation model,
      openai, anthropic, claude, chatgpt, gemini, mistral, model context protocol, mcp, ai act,
      generative ai, ia générative, intelligence artificielle, enterprise ai, ai adoption]
  2: [ai, ia, copilot, deepmind, llama, deepseek, qwen, grok, xai, hugging face, nvidia, ai startup,
      y combinator, raises, funding, ipo, regulation, régulation, cnil, sovereign, souveraineté, gpu]
  1: [machine learning, automation, automatisation, data, cloud, startup, chips, robotics, cybersecurity]

